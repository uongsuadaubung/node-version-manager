name: Release Build

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release version tag (vd: v0.4.0)'
        required: true
        default: 'v0.4.0'
        type: string
      release_name:
        description: 'Tên Release (tuỳ chọn, mặc định lấy theo tag)'
        required: false
        type: string
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        target:
          - x86_64-pc-windows-gnu
          - x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Run Tests (Linux Target)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test

      - name: Install Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Build
        run: cargo zigbuild --target ${{ matrix.target }} --release

      - name: Prepare Assets
        run: |
          mkdir -p assets
          if [ -f target/${{ matrix.target }}/release/node-version-manager.exe ]; then
            cp target/${{ matrix.target }}/release/node-version-manager.exe assets/nvm-rust-${{ matrix.target }}.exe
          fi
          if [ -f target/${{ matrix.target }}/release/node-version-manager ]; then
            cp target/${{ matrix.target }}/release/node-version-manager assets/nvm-rust-${{ matrix.target }}
          fi

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          name: ${{ inputs.release_name || inputs.tag_name || github.ref_name }}
          files: assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
