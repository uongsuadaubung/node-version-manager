name: Release Build

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (định dạng yyyy.mm.dd, để trống sẽ tự lấy ngày hiện tại)'
        required: false
        default: ''
        type: string
      release_name:
        description: 'Tên Release (tuỳ chọn, mặc định lấy theo tag)'
        required: false
        type: string
  push:
    tags:
      - 'v*'
      - '[0-9]*'

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-pc-windows-gnu
          - x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Run Tests (Linux Target)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo test

      - name: Setup MinGW for Windows GNU target
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix

      - name: Build
        run: cargo build --target ${{ matrix.target }} --release
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc
          AR_x86_64_pc_windows_gnu: x86_64-w64-mingw32-ar
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS: "-C target-feature=+crt-static -C link-args=-static -C link-args=-static-libgcc"

      - name: Prepare Assets
        run: |
          mkdir -p dist
          if [ -f target/${{ matrix.target }}/release/node-version-manager.exe ]; then
            cp target/${{ matrix.target }}/release/node-version-manager.exe dist/nvm-rust-${{ matrix.target }}.exe
          fi
          if [ -f target/${{ matrix.target }}/release/node-version-manager ]; then
            cp target/${{ matrix.target }}/release/node-version-manager dist/nvm-rust-${{ matrix.target }}
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: release-assets

      - name: Determine Release Tag
        id: vars
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG=$(date +'%Y.%m.%d')
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: ${{ inputs.release_name || steps.vars.outputs.tag }}
          files: release-assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
