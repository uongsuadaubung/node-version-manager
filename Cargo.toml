[package]
name = "node-version-manager"
version = "0.4.0"
edition = "2024"

[dependencies]
ureq = { version = "2.10", default-features = false, features = ["tls", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
ratatui = "0.29"
crossterm = "0.28"

[profile.release]
opt-level = "z"      # Tối ưu hóa kích thước tối đa
lto = true           # Link Time Optimization
codegen-units = 1    # Tối ưu hóa toàn cục
panic = "abort"      # Loại bỏ stack unwinding
strip = true         # Xóa bỏ debug symbols
